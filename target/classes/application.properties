# Server Port
server.port=8080

# Application Name
spring.application.name=ORWEL

# --- Congress API Configuration ---
congress.api.key=${CONGRESS_API_KEY}
congress.api.url=${congress.api.url}


# --- JPA/Hibernate Configuration ---


# --- Supabase REST API Configuration ---
# Found in Supabase Dashboard -> Settings -> API
# URL format: https://<your-project-id>.supabase.co
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
# Use the "service_role" key if you want to bypass Row Level Security (RLS) for backend writes
# Use "anon" key if your table has public insert policies
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
logging.level.com.zaxxer.hikari=DEBUG
spring.jackson.property-naming-strategy=SNAKE_CASE